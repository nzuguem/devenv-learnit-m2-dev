services:
  gateway:
    build: gateway
    ports:
      - 4000:4000
    restart: on-failure
    environment:
      HOST_USERS_SUBGRAPH_SERVICE_BASE_URL: http://users:4001
      HOST_PRODUCTS_SUBGRAPH_SERVICE_BASE_URL: http://products:4002
      HOST_REVIEWS_SUBGRAPH_SERVICE_BASE_URL: http://reviews:4003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      - users
      - products
      - reviews

  users:
    build: subgraphs/users
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  products:
    build: subgraphs/products
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  reviews:
    build: subgraphs/reviews
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - 3000:3000