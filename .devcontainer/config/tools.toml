# Devcontainer toolbox: the container's *global* mise config (MISE_GLOBAL_CONFIG_FILE, set in
# .devcontainer/devcontainer.json), so tools are available from any directory, not only in the repo.
# Tools not available with mise stay as devcontainer features in .github/.devcontainer.
# Add a tool from the devcontainer with `mise use -g <tool>@<version>`.
[tools]
# Languages / runtimes
node = "26.13.0"
python = "3.15.2"
uv = "0.13.7"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
jbang = "0.143.0"

# Dev tooling
gh = "2.103.3"
prek = "0.5.10"
jq = "1.8.2"
yq = "4.54.2"
fzf = "0.74.5"
neovim = "0.12.6"
herdr = "0.9.5"
watchexec = "2.8.0"
usage = "7.3.0" # Required by `mise completion` (bashrc.sh) and tasks `usage` specs

# AI assistants
claude = "2.1.318"
copilot = "1.0.106"
antigravity-cli = "1.5.2" # Replaces gemini-cli
quarkus = "3.40.1.1"

[settings]
experimental = true
